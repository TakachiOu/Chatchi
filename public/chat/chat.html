<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4748269863410868"
     crossorigin="anonymous">
    </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Chatchi – غرفة المحادثة</title>
  
  <meta name="robots" content="noindex, nofollow"> 
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <link rel="stylesheet" href="/chat/chat.css">

  
</head>

<body>

    <div class="background-blurs">
        <div class="blur-orb" id="orb1"></div>
        <div class="blur-orb" id="orb2"></div>
    </div>

    <div id="chat-view">
        <div class="chat-container">
            <p class="chat-status" data-key-status>جارٍ تهيئة الاتصال...</p>
            
            <div class="messages-area">
                </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input-field" data-key="chatPlaceholder" placeholder="اكتب رسالتك..." disabled autocomplete="off">
                <button id="leave-button" title="إنهاء المحادثة" disabled>
                    <i class="fa-solid fa-person-walking-arrow-right"></i>
                </button>
                <button id="send-button" data-key="chatSendBtn" disabled>إرسال</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 data-key="confirmLeaveTitle">هل أنت متأكد؟</h3>
            <p data-key="confirmLeaveText">هل تريد حقاً مغادرة المحادثة؟</p>
            <div class="modal-buttons">
                <button id="confirm-yes-btn" class="modal-btn yes-btn" data-key="confirmYes">نعم، غادر</button>
                <button id="confirm-no-btn" class="modal-btn no-btn" data-key="confirmNo">لا، ابقَ</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>

    <script src="/chat/chat.js"></script>

</body>
</html>
